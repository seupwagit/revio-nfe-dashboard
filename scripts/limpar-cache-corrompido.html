<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpar Cache Corrompido</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button.danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-line {
            margin: 5px 0;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔧 Limpar Cache Corrompido</h1>
        <p class="subtitle">Ferramenta para detectar e limpar cache inconsistente</p>
        
        <button onclick="analisarCache()">🔍 Analisar Cache</button>
        <button onclick="limparTudo()" class="danger">🗑️ Limpar Tudo</button>
        <button onclick="limparUltimoAno()" class="danger">🗑️ Limpar Último Ano</button>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        const log = document.getElementById('log');
        
        function addLog(message, type = 'info') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }
        
        function clearLog() {
            log.innerHTML = '';
        }
        
        function analisarCache() {
            clearLog();
            addLog('🔍 Analisando cache...', 'info');
            
            const keys = Object.keys(localStorage);
            const cacheKeys = keys.filter(k => k.startsWith('analytics_cache_'));
            
            addLog(`\n📊 Total de itens em cache: ${cacheKeys.length}`, 'info');
            
            if (cacheKeys.length === 0) {
                addLog('✅ Cache vazio - nada para analisar', 'success');
                return;
            }
            
            const periodos = [];
            
            for (const key of cacheKeys) {
                try {
                    const data = JSON.parse(localStorage.getItem(key));
                    const match = key.match(/analytics_cache_(.+?)_(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})/);
                    
                    if (match) {
                        const [, collection, dtIni, dtFin] = match;
                        const dias = Math.ceil((new Date(dtFin) - new Date(dtIni)) / (1000 * 60 * 60 * 24));
                        const registros = data.data?.stats?.totalNotas || 0;
                        
                        periodos.push({
                            key,
                            collection,
                            dtIni,
                            dtFin,
                            dias,
                            registros
                        });
                    }
                } catch (e) {
                    addLog(`❌ Erro ao ler ${key}: ${e.message}`, 'error');
                }
            }
            
            // Agrupar por collection
            const porCollection = {};
            periodos.forEach(p => {
                if (!porCollection[p.collection]) {
                    porCollection[p.collection] = [];
                }
                porCollection[p.collection].push(p);
            });
            
            // Analisar cada collection
            let problemasEncontrados = 0;
            
            for (const [collection, items] of Object.entries(porCollection)) {
                addLog(`\n📦 Collection: ${collection}`, 'info');
                
                // Ordenar por dias
                items.sort((a, b) => a.dias - b.dias);
                
                items.forEach(item => {
                    addLog(`  • ${item.dias} dias (${item.dtIni} até ${item.dtFin}): ${item.registros.toLocaleString()} registros`, 'info');
                });
                
                // Verificar inconsistências
                for (let i = 0; i < items.length; i++) {
                    for (let j = 0; j < i; j++) {
                        const maior = items[i];
                        const menor = items[j];
                        
                        // Verificar se menor está contido no maior
                        if (menor.dtIni >= maior.dtIni && menor.dtFin <= maior.dtFin) {
                            if (maior.registros < menor.registros) {
                                addLog(`\n⚠️ INCONSISTÊNCIA DETECTADA!`, 'warning');
                                addLog(`  Período MAIOR tem MENOS dados:`, 'warning');
                                addLog(`  • ${maior.dias} dias: ${maior.registros.toLocaleString()} registros`, 'warning');
                                addLog(`  • ${menor.dias} dias: ${menor.registros.toLocaleString()} registros`, 'warning');
                                addLog(`  Cache corrompido: ${maior.key}`, 'error');
                                problemasEncontrados++;
                            }
                        }
                    }
                }
            }
            
            if (problemasEncontrados === 0) {
                addLog('\n✅ Nenhuma inconsistência encontrada!', 'success');
            } else {
                addLog(`\n⚠️ ${problemasEncontrados} inconsistência(s) encontrada(s)!`, 'warning');
                addLog('💡 Use "Limpar Tudo" para corrigir', 'info');
            }
        }
        
        function limparTudo() {
            if (!confirm('Tem certeza que deseja limpar TODO o cache?')) return;
            
            clearLog();
            addLog('🗑️ Limpando todo o cache...', 'warning');
            
            const keys = Object.keys(localStorage);
            const cacheKeys = keys.filter(k => k.startsWith('analytics_cache_'));
            
            cacheKeys.forEach(key => {
                localStorage.removeItem(key);
                addLog(`  ✓ Removido: ${key}`, 'success');
            });
            
            addLog(`\n✅ ${cacheKeys.length} item(ns) removido(s)!`, 'success');
            addLog('💡 Recarregue a página e busque novamente', 'info');
        }
        
        function limparUltimoAno() {
            clearLog();
            addLog('🗑️ Procurando cache do "Último Ano"...', 'warning');
            
            const keys = Object.keys(localStorage);
            const cacheKeys = keys.filter(k => k.startsWith('analytics_cache_'));
            
            let removidos = 0;
            
            for (const key of cacheKeys) {
                const match = key.match(/analytics_cache_(.+?)_(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})/);
                if (match) {
                    const [, , dtIni, dtFin] = match;
                    const dias = Math.ceil((new Date(dtFin) - new Date(dtIni)) / (1000 * 60 * 60 * 24));
                    
                    // Considerar "Último Ano" como períodos de 350-380 dias
                    if (dias >= 350 && dias <= 380) {
                        localStorage.removeItem(key);
                        addLog(`  ✓ Removido: ${key} (${dias} dias)`, 'success');
                        removidos++;
                    }
                }
            }
            
            if (removidos === 0) {
                addLog('ℹ️ Nenhum cache de "Último Ano" encontrado', 'info');
            } else {
                addLog(`\n✅ ${removidos} item(ns) do "Último Ano" removido(s)!`, 'success');
                addLog('💡 Recarregue a página e busque "Último Ano" novamente', 'info');
            }
        }
        
        // Analisar automaticamente ao carregar
        window.onload = () => {
            addLog('👋 Ferramenta de Limpeza de Cache carregada!', 'success');
            addLog('💡 Clique em "Analisar Cache" para começar\n', 'info');
        };
    </script>
</body>
</html>
